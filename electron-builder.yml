appId: com.studylab.ai
productName: StudyLab AI
copyright: Copyright © 2026 StudyLab AI

directories:
  output: release
  buildResources: build

asar: true

files:
  - dist-electron/**/*
  - package.json
  - node_modules/**/*
  - "!node_modules/three/**/*"
  - "!node_modules/pdfjs-dist/**/*"
  - "!node_modules/katex/**/*"
  - "!node_modules/pptx-preview/**/*"
  - "!node_modules/docx-preview/**/*"
  - "!node_modules/highlight.js/**/*"
  - "!node_modules/lucide-react/**/*"
  - "!node_modules/react/**/*"
  - "!node_modules/react-dom/**/*"
  - "!node_modules/xlsx/**/*"
  - "!node_modules/mammoth/**/*"
  - "!node_modules/jszip/**/*"
  - "!node_modules/marked/**/*"
  - "!node_modules/express/**/*"
  - "!node_modules/multer/**/*"
  - "!node_modules/zod/**/*"
  - "!node_modules/cors/**/*"
  - "!node_modules/uuid/**/*"

extraResources:
  - from: dist
    to: web
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: StudyLab-AI-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: StudyLab AI
  runAfterFinish: true

# GitHub Releases otomatik güncelleme kaynağı (electron-updater).
# Yeni sürüm yayınlamak için package.json version değerini artırıp `npm run release:win` çalıştırın.
publish:
  provider: github
  owner: DiaSy24
  repo: StudyLab-AI
  releaseType: release
