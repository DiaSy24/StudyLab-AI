appId: com.studylab.ai
productName: StudyLab AI
copyright: Copyright © 2026 StudyLab AI

directories:
  output: release
  buildResources: build

asar: true

files:
  - dist-electron/**/*
  - package.json
  - "!node_modules/**/*"
  - node_modules/electron-updater/**/*
  - node_modules/builder-util-runtime/**/*
  - node_modules/fs-extra/**/*
  - node_modules/graceful-fs/**/*
  - node_modules/jsonfile/**/*
  - node_modules/universalify/**/*
  - node_modules/js-yaml/**/*
  - node_modules/argparse/**/*
  - node_modules/sprintf-js/**/*
  - node_modules/lazy-val/**/*
  - node_modules/lodash.escaperegexp/**/*
  - node_modules/lodash.isequal/**/*
  - node_modules/semver/**/*
  - node_modules/tiny-typed-emitter/**/*
  - node_modules/debug/**/*
  - node_modules/ms/**/*
  - node_modules/sax/**/*

extraResources:
  - from: dist
    to: web
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: StudyLab-AI-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: StudyLab AI
  runAfterFinish: true
  differentialPackage: store-asar

# GitHub Releases otomatik güncelleme kaynağı (electron-updater).
# Yeni sürüm yayınlamak için package.json version değerini artırıp `npm run release:win` çalıştırın.
publish:
  provider: github
  owner: DiaSy24
  repo: StudyLab-AI
  releaseType: release
